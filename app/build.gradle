plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
}

// Release signing: keystore path, alias and passwords live in Artly/keystore.properties (not in git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    keystoreProperties.getProperty(it)?.trim()
}

android {
    namespace 'com.orion.templete'
    compileSdk 36

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId "com.orion.templete"
        minSdk 24
        targetSdk 36
        versionCode 26
        versionName "2.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // Calls (Agora) ship big native libraries per ABI. Every phone the Play Store serves is ARM; x86 would
        // only add ~100 MB to the bundle for emulators (which run the ARM build through translation).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
            // Local emulator builds only (x86_64 images): gradlew assembleDebug -PemulatorAbi
            if (project.hasProperty('emulatorAbi')) abiFilters "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        // Match current Kotlin (1.9.0) → Compose Compiler 1.5.0 per compatibility table
        kotlinCompilerExtensionVersion '1.5.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // Stored uncompressed and page-aligned (16 KB page-size devices)
            useLegacyPackaging false
        }
    }

}


dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation platform('androidx.compose:compose-bom:2025.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3-android:1.2.1'
    implementation 'com.google.firebase:firebase-auth-ktx:23.1.0'
    // Google sign-in through Credential Manager
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.firebase:firebase-storage:21.0.1'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.1'
    // Chat v2: push notifications (FCM data messages), process lifecycle for presence, EXIF for photo uploads,
    // extended Material icons for the chat screens (version from the Compose BOM)
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.compose.material:material-icons-extended'
    // Audio / video calls in chat (tokens are minted by the backend; the app never holds the certificate).
    // Only the modules 1:1 calls use. Screen sharing in particular must stay out: it adds a media-projection
    // foreground service and permission to the manifest, which Google Play asks to be justified. The other
    // extensions (voice / video effects, AV1, spatial audio, ...) are never loaded and only add size.
    implementation('io.agora.rtc:full-sdk:4.6.0') {
        ['full-screen-sharing', 'screen-capture', 'audio-beauty', 'clear-vision', 'full-content-inspect',
         'full-face-capture', 'full-face-detect', 'full-video-av1-codec-dec', 'full-video-av1-codec-enc',
         'full-virtual-background', 'full-voice-drive', 'full-vqa', 'spatial-audio'].each { unused ->
            exclude group: 'io.agora.rtc', module: unused
        }
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'com.github.composeuisuite:ohteepee:1.0.3'

    /** kotlin - coroutines **/
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.1'



    //Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Dagger Hilt
    implementation 'com.google.dagger:hilt-android:2.49'
    kapt 'com.google.dagger:hilt-android-compiler:2.49'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'


    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.play:integrity:1.4.0'

    //Jetpack Navigation Component
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'

    // LiveData
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'

    //fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.0'


    //lottie
    implementation "com.airbnb.android:lottie-compose:6.6.4"



    /** SplashScreen **/
    implementation("androidx.core:core-splashscreen:1.0.1")


    /**Paging**/
    implementation "androidx.paging:paging-runtime:3.1.1"
    implementation "androidx.paging:paging-compose:3.2.0-beta01"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.2'

    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "io.coil-kt:coil-compose:2.3.0"
    //room
    def room_version = "2.6.1"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'com.github.freshworks:freshchat-android:6.3.8'

    /**Ucrop**/
    implementation ("com.github.yalantis:ucrop:2.2.6")
    implementation("io.coil-kt:coil-compose:2.4.0")

    implementation("com.mixpanel.android:mixpanel-android:7.+")

    // Facebook SDK
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
}
